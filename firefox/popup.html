<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMP Send Context</title>
  <style>
    :root {
      color-scheme: light dark;
      --panel: #f6f8fa;
      --surface: #ffffff;
      --border: #d0d7de;
      --muted: #57606a;
      --accent: #0969da;
      --accent-contrast: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --panel: #161b22;
        --surface: #21262d;
        --border: #444c56;
        --muted: #8b949e;
        --accent: #2f81f7;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: var(--panel);
      color: CanvasText;
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
    }
    header {
      margin-bottom: 14px;
    }
    .eyebrow {
      margin: 0 0 3px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
    }
    .description {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .actions {
      display: grid;
      gap: 8px;
    }
    button {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: CanvasText;
      font: inherit;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }
    button:disabled {
      cursor: wait;
      opacity: .65;
    }
    #status {
      min-height: 2.8em;
      margin: 12px 2px 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">OMP Send Context</p>
    <h1>Firefox controls</h1>
    <p class="description">Send GitHub context to your active OMP session.</p>
  </header>
  <div class="actions">
    <button id="debug" type="button"></button>
    <button id="copy" type="button">Copy debug log</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
