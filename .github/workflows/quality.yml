name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package

  native-host:
    name: Go native host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: npm run test:firefox-native-host
